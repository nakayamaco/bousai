<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>薬の備えクイズ｜石川県薬剤師会</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#f4f8f5; --paper:#ffffff; --ink:#1c2b27; --sub:#4d605a;
  --green:#1f7a5c; --green-d:#14523d; --tint:#e2f0e8; --amber:#f2b134; --line:#c9d9d0;
  --ok:#1f7a5c; --ng:#b5472f; --okbg:#e2f0e8; --ngbg:#fbe9e3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1a16; --paper:#16241f; --ink:#e8f1ec; --sub:#a8bab2;
    --green:#4cc296; --green-d:#0f3a2b; --tint:#1c3329; --line:#2c4439;
    --ok:#4cc296; --ng:#f0937b; --okbg:#1c3329; --ngbg:#3a2620;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;font-size:17px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;background:var(--paper);min-height:100%}
header{background:var(--green-d);color:#fff;padding:22px 24px 18px;border-bottom:6px solid var(--amber)}
header p{margin:0;font-size:.85rem;opacity:.9}
header h1{margin:2px 0 0;font-size:1.7rem;font-weight:900;line-height:1.3}
main{padding:24px}
.bar{height:8px;background:var(--tint);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.count{font-size:.85rem;color:var(--sub);margin:0 0 18px}
h2{font-size:1.25rem;line-height:1.55;margin:0 0 18px;font-weight:700}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--paper);
  border:2px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.link{background:none;border:0;padding:0;margin:14px 0 0;font:inherit;font-size:.9rem;color:var(--green);text-decoration:underline;cursor:pointer}
.hint{margin:10px 0 0;font-size:.92rem;color:var(--sub)}
.fb{margin-top:20px;padding:14px 16px;border-radius:8px;border-left:6px solid var(--ok);background:var(--okbg)}
.fb.ng{border-left-color:var(--ng);background:var(--ngbg)}
.fb strong{display:block;font-size:1.05rem;margin-bottom:2px}
.fb p{margin:0;font-size:.95rem}
.btn{display:block;width:100%;margin-top:18px;font:inherit;font-weight:700;font-size:1.05rem;
  color:#fff;background:var(--green-d);border:0;border-radius:8px;padding:14px;cursor:pointer}
.btn.alt{background:var(--paper);color:var(--green);border:2px solid var(--green)}
[hidden]{display:none!important}
.result{text-align:center}
.score{font-size:3.6rem;font-weight:900;color:var(--green);line-height:1.2;margin:8px 0 0}
.score small{font-size:1.3rem;color:var(--sub);font-weight:500}
.msg{font-size:1.05rem;margin:8px 0 22px}
.info{text-align:left;background:var(--tint);border-radius:8px;padding:14px 16px;font-size:.92rem}
.info p{margin:0 0 4px}
.info a{color:var(--green);word-break:break-all}
footer{padding:0 24px 24px;font-size:.78rem;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>公益社団法人石川県薬剤師会　いしかわ防災フェア2026</p>
    <h1>薬の備えクイズ</h1>
  </header>

  <main>
    <section id="quiz">
      <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      <p class="count" id="count"></p>
      <h2 id="q"></h2>
      <ul class="opts" id="opts"></ul>
      <button class="link" id="hintBtn" type="button">ヒントを見る</button>
      <p class="hint" id="hint" hidden></p>
      <div id="fb" role="status" aria-live="polite" hidden></div>
      <button class="btn" id="next" type="button" hidden></button>
    </section>

    <section id="result" class="result" hidden>
      <p>あなたの結果</p>
      <p class="score"><span id="sc"></span><small> / 5問</small></p>
      <p class="msg" id="msg"></p>
      <div class="info">
        <p>ブース：いしかわ防災フェア2026　産業展示館1号館内</p>
        <p>体験コーナー：モバイルファーマシー</p>
        <p>公益社団法人石川県薬剤師会<br>TEL 076-231-6634／FAX 076-223-1520<br>
        <a href="https://www.ishikawakenyaku.com/">https://www.ishikawakenyaku.com/</a></p>
      </div>
      <button class="btn alt" id="retry" type="button">もう一度挑戦する</button>
    </section>
  </main>

  <footer>一般的な情報です。個別の薬や病状については、かかりつけの医師・薬剤師にご相談ください。</footer>
</div>

<script>
var QS = [
  {q:"災害に備えて、お薬手帳はどうしておくと安心でしょう？",
   o:["家に置いたままにしておく","持ち歩き、表紙や薬の一覧をスマホで撮影しておく","薬を飲み終わったら捨てる"],a:1,
   h:"手帳が手元にない場合のことを考えてみましょう。",
   e:"手帳をなくしたり持ち出せなかったりしても、写真があれば薬の名前や飲み方を伝えられます。電子お薬手帳も便利です。"},
  {q:"持ち出し袋に入れた薬や衛生用品の使用期限は、どのくらいの頻度で点検するとよいでしょう？",
   o:["一度入れたら点検しなくてよい","年に1回くらい（防災の日など）","10年に1回"],a:1,
   h:"覚えやすい「決まった日」を作るのがコツです。",
   e:"期限切れの薬や消毒液は、いざというときに使えません。防災の日や誕生日など、決まった日に見直す習慣をつけましょう。"},
  {q:"避難所でトイレに行きたくないからと、水分をとるのを控えるとどうなるでしょう？",
   o:["体調がよくなる","変わらない","脱水や熱中症、血栓のリスクが高まる"],a:2,
   h:"体の中の水分が足りなくなると…？",
   e:"水分不足は脱水や熱中症だけでなく、血栓（エコノミークラス症候群）の原因にもなります。こまめな水分補給を心がけましょう。"},
  {q:"車内や狭い場所で長く過ごすとき、エコノミークラス症候群の予防に役立つのはどれ？",
   o:["足首を回したり、時々歩いたりする","できるだけ動かずじっとしている","水分をとらない"],a:0,
   h:"足の血流をよくするには？",
   e:"足を動かすと血の流れがよくなります。足首の曲げ伸ばしや、こまめに歩くことを意識しましょう。"},
  {q:"災害時に出動することがある「モバイルファーマシー」とは何でしょう？",
   o:["調剤設備を備えた、医薬品供給のための車両","スマートフォン用の薬のアプリ","薬を空から届けるドローン"],a:0,
   h:"「モバイル」は「移動できる」という意味です。",
   e:"薬剤師が車内で調剤や医薬品の供給を行える災害対応の車両です。今日は体験コーナーでご覧いただけます。"}
];
var $ = function(id){return document.getElementById(id)};
var i = 0, score = 0, done = false;

function shuffle(arr){
  for (var k = arr.length - 1; k > 0; k--){
    var j = Math.floor(Math.random() * (k + 1));
    var t = arr[k]; arr[k] = arr[j]; arr[j] = t;
  }
  return arr;
}

function show(){
  var d = QS[i];
  done = false;
  $('count').textContent = '第' + (i + 1) + '問 / ' + QS.length + '問';
  $('prog').style.width = (i / QS.length * 100) + '%';
  $('q').textContent = d.q;
  $('hint').textContent = d.h;
  $('hint').hidden = true;
  $('hintBtn').hidden = false;
  $('fb').hidden = true;
  $('next').hidden = true;
  var ul = $('opts'); ul.innerHTML = '';
  var order = shuffle(d.o.map(function(_, n){return n}));
  order.forEach(function(n){
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = d.o[n];
    b.onclick = function(){ pick(b, n === d.a); };
    li.appendChild(b); ul.appendChild(li);
  });
}

function pick(btn, correct){
  if (done) return;
  done = true;
  var d = QS[i];
  if (correct) score++;
  var btns = $('opts').querySelectorAll('.opt');
  btns.forEach(function(b){
    b.disabled = true;
    if (b.textContent === d.o[d.a]) b.classList.add('ok');
  });
  if (!correct) btn.classList.add('ng');
  var fb = $('fb');
  fb.className = 'fb' + (correct ? '' : ' ng');
  fb.innerHTML = '<strong>' + (correct ? '正解です！' : 'おしい！') + '</strong><p></p>';
  fb.querySelector('p').textContent = d.e;
  fb.hidden = false;
  $('hintBtn').hidden = true; $('hint').hidden = true;
  $('next').textContent = (i === QS.length - 1) ? '結果を見る' : '次の問題へ';
  $('next').hidden = false;
  $('next').focus();
}

function finish(){
  $('quiz').hidden = true;
  $('result').hidden = false;
  $('sc').textContent = score;
  $('msg').textContent = score === 5 ? 'すばらしい！防災の達人です。'
    : score >= 3 ? 'よくできました。パンフレットで備えを確認しましょう。'
    : 'これから備えていきましょう。ブースで薬剤師にご相談ください。';
  window.scrollTo(0, 0);
}

$('hintBtn').onclick = function(){ $('hint').hidden = false; $('hintBtn').hidden = true; };
$('next').onclick = function(){ if (i === QS.length - 1) finish(); else { i++; show(); } };
$('retry').onclick = function(){ i = 0; score = 0; $('result').hidden = true; $('quiz').hidden = false; show(); };
show();
</script>
</body>
</html>
